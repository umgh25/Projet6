<div id="new-post">
  <h2>Créer un nouvel article</h2>

  <form [formGroup]="newPostForm" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="field">
      <mat-label>Sélectionner un thème</mat-label>

      <mat-select formControlName="topicId">
        <mat-option *ngFor="let topic of (topics$ | async)" [value]="topic.id">
          {{ topic.title }}
        </mat-option>
      </mat-select>

      <mat-error *ngIf="newPostForm.get('topicId')?.hasError('required')
                        && newPostForm.get('topicId')?.touched">
        Champ obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Titre de l'article</mat-label>
      <input matInput formControlName="title">

      <mat-error *ngIf="newPostForm.get('title')?.hasError('required')
                        && newPostForm.get('title')?.touched">
        Champ obligatoire
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contenu de l'article</mat-label>
      <textarea rows="5" matInput formControlName="content"></textarea>

      <mat-error *ngIf="newPostForm.get('content')?.hasError('required')
                        && newPostForm.get('content')?.touched">
        Champ obligatoire
      </mat-error>
    </mat-form-field>

    <div class="button-container">
      <button type="submit" mat-raised-button color="primary">
        Créer
      </button>
    </div>

  </form>
</div>
